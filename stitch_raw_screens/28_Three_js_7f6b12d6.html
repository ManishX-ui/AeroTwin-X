  pod.castShadow = true;

  const group = new THREE.Group();
  group.add(pylon);
  group.add(pod);
  return group;
}

// 10. Main Landing Gear (Twin legs)

function createMainLeg(side) {
  const leg = new THREE.Group();
  const mainStrut = new THREE.CylinderGeometry(0.1, 0.08, 3.1, 10);
  const mainStrutMesh = new THREE.Mesh(mainStrut, chromeMat);
  mainStrutMesh.position.set(side * 1.0, -1.1, 0);
  mainStrutMesh.rotation.z = -side * 0.45;
  leg.add(mainStrutMesh);

  const wheelGeo = new THREE.CylinderGeometry(0.55, 0.55, 0.36, 18);
  wheelGeo.rotateZ(Math.PI / 2);
  const wheel = new THREE.Mesh(wheelGeo, tireMat);
  wheel.position.set(side * 2.2, -2.3, 0);
  wheel.castShadow = true;
  leg.add(wheel);

  return leg;
}

// Animation & Interaction Variables
let isOrbiting = false;
let autoRotate = true;
let isExploded = false;
let isWireframe = false;
let previousMousePosition = { x: 0, y: 0 };
let currentRotationY = 0.4;
let currentRotationX = 0.2;
let targetRotationY = 0.4;
let targetRotationX = 0.2;
let targetCameraPos = camera.position.clone();
let targetLookAt = new THREE.Vector3(0, 0, 0);
let currentLookAt = new THREE.Vector3(0, 0, 0);
let cameraZoomDist = 38;

// Raycaster for 3D clicks
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

// Orbit controls via direct mouse drag
container.addEventListener('mousedown', (e) => {
  isOrbiting = true;
  previousMousePosition = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mousemove', (e) => {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

  if (isOrbiting) {
    const deltaX = e.clientX - previousMousePosition.x;
    const deltaY = e.clientY - previousMousePosition.y;
    targetRotationY += deltaX * 0.007;
    targetRotationX += deltaY * 0.007;
    targetRotationX = Math.max(-0.6, Math.min(1.1, targetRotationX));
    previousMousePosition = { x: e.clientX, y: e.clientY };
  }
});

window.addEventListener('mouseup', () => {
  isOrbiting = false;
});

// Scroll to Zoom
container.addEventListener('wheel', (e) => {
  e.preventDefault();
  cameraZoomDist += e.deltaY * 0.035;
  cameraZoomDist = Math.max(12, Math.min(65, cameraZoomDist));
}, { passive: false });

// Global interaction bridge for HTML buttons and left/right panels
window.uavApp = {
  selectPart: function(partId) {
    const target = window.uavParts[partId];
    if (!target) return;

    // Reset others opacity
    Object.keys(window.uavParts).forEach(key => {
      const p = window.uavParts[key];
      p.traverse(child => {
        if (child.isMesh && child.material) {
          if (key === partId) {
            child.material.emissive = new THREE.Color(0x00e5ff);
            child.material.emissiveIntensity = 0.6;
          } else {
            child.material.emissive = new THREE.Color(0x000000);
            child.material.emissiveIntensity = 0.0;
          }
        }
      });
    });

    // Focus camera
    const offset = target.userData.cameraTargetOffset;
    targetLookAt.copy(offset);
    cameraZoomDist = 18;
  },

  resetSelection: function() {
    Object.keys(window.uavParts).forEach(key => {
      const p = window.uavParts[key];
      p.traverse(child => {
        if (child.isMesh && child.material) {
          child.material.emissive = new THREE.Color(0x000000);
          child.material.emissiveIntensity = 0.0;
          child.material.transparent = false;
          child.material.opacity = 1.0;
        }
      });
    });
    targetLookAt.set(0, 0, 0);
    cameraZoomDist = 38;
  },

  setPresetView: function(viewName) {
    autoRotate = false;
    if (viewName === 'front') {
      targetRotationY = 0;
      targetRotationX = 0.05;
    } else if (viewName === 'back') {
      targetRotationY = Math.PI;
      targetRotationX = 0.1;
    } else if (viewName === 'left') {
      targetRotationY = -Math.PI / 2;
      targetRotationX = 0.05;
    } else if (viewName === 'right') {
      targetRotationY = Math.PI / 2;
      targetRotationX = 0.05;
    } else if (viewName === 'top') {
      targetRotationY = 0;
      targetRotationX = 1.35;
    } else if (viewName === 'bottom') {
      targetRotationY = 0;
      targetRotationX = -0.55;
    } else if (viewName === 'iso') {
      targetRotationY = 0.65;
      targetRotationX = 0.28;
    }
  },

  toggleExplodedView: function(state) {
    isExploded = (state !== undefined) ? state : !isExploded;
    return isExploded;
  },

  toggleWireframe: function(state) {
    isWireframe = (state !== undefined) ? state : !isWireframe;
    scene.traverse(child => {
      if (child.isMesh && child.material && child !== floor && child !== ring && child !== innerRing) {
        child.material.wireframe = isWireframe;
      }
    });
    return isWireframe;
  },

  toggleAutoRotate: function(state) {
    autoRotate = (state !== undefined) ? state : !autoRotate;
    return autoRotate;
  },

  setZoom: function(factor) { // factor: 0 (near) to 1 (far)
    cameraZoomDist = 14 + factor * 46;
  }
};

// Click handler in 3D scene to dispatch to HTML app
renderer.domElement.addEventListener('click', (e) => {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(uavGroup.children, true);

  if (intersects.length > 0) {
    let curr = intersects[0].object;
    while (curr && curr.parent && curr.parent !== uavGroup) {
      curr = curr.parent;
    }
    if (curr && curr.userData && curr.userData.partId) {
      if (window.onUAVPartClicked) {
        window.onUAVPartClicked(curr.userData.partId);
      }
    }
  }
});

// Window resize
window.addEventListener('resize', () => {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

// Render Loop
let clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();
  const time = clock.getElapsedTime();

  // Spin pusher prop
  if (propBlades) {
    propBlades.rotation.z += 28 * delta;
  }

  // Strobe beacon flash
  if (tailStrobe) {
    tailStrobe.material.opacity = (Math.sin(time * 8) > 0.4) ? 1.0 : 0.15;
  }

  // Smooth rotation
  if (autoRotate && !isOrbiting) {
    targetRotationY += 0.25 * delta;
  }

  currentRotationY += (targetRotationY - currentRotationY) * 0.08;
  currentRotationX += (targetRotationX - currentRotationX) * 0.08;

  // Calculate spherical camera position
  const cosX = Math.cos(currentRotationX);
  const sinX = Math.sin(currentRotationX);
  const cosY = Math.cos(currentRotationY);
  const sinY = Math.sin(currentRotationY);

  camera.position.x = currentLookAt.x + cameraZoomDist * cosX * sinY;
  camera.position.y = currentLookAt.y + cameraZoomDist * sinX;
  camera.position.z = currentLookAt.z + cameraZoomDist * cosX * cosY;

  currentLookAt.lerp(targetLookAt, 0.07);
  camera.lookAt(currentLookAt);

  // Animate exploded positions
  const explodeTargetMultiplier = isExploded ? 1.0 : 0.0;
  Object.keys(window.uavParts).forEach(key => {
    const mesh = window.uavParts[key];
    const base = mesh.userData.basePos;
    const vec = mesh.userData.explodeVector;
    mesh.position.x += (base.x + vec.x * explodeTargetMultiplier - mesh.position.x) * 0.1;
    mesh.position.y += (base.y + vec.y * explodeTargetMultiplier - mesh.position.y) * 0.1;
    mesh.position.z += (base.z + vec.z * explodeTargetMultiplier - mesh.position.z) * 0.1;
  });

  renderer.render(scene, camera);
}

animate();

})();
</script>
</div>
