[project]
name = "aerotwin-x"
version = "1.0.0"
description = "AeroTwin-X Digital Twin FastAPI Application"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.29",
    "scikit-learn>=1.4.2",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "scipy>=1.13.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
]

[tool.vercel]
entrypoint = "backend.app.main:app"
